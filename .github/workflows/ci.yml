name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. PR runs cancel the previous one so a re-pushed branch
# never queues a stale run; push-to-main and manual runs do not cancel, so
# a red run on main stays visible while the fix lands. Tags do not start
# this workflow: release.yml handles them. The jobs are independent and
# run in parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # Every job sets timeout-minutes: GitHub's default is 360.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint is a Go binary, installed from the upstream release
      # with its checksum instead of through a wrapper action.
      - name: Install actionlint
        run: |
          set -eu
          # A version bump must update both lines: sha= is the
          # actionlint_<ver>_linux_amd64.tar.gz entry of the upstream
          # actionlint_<ver>_checksums.txt release asset.
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Run actionlint
        run: actionlint -color

  lint:
    name: lint (JavaScript, CSS, HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Cloudflare Pages publishes main as soon as a PR is merged, and the
  # production domain caches JS and CSS in the browser for a year. The
  # ?v=<version> in src/index.html only refreshes them if the version
  # changes in the same PR that changes the files (the unit tests check
  # that ?v= equals package.json).
  asset-version:
    name: asset version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail if src/ JS or CSS changed without a version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          changed="$(git diff --name-only "${base}" "${HEAD_SHA}" -- 'src/*.js' 'src/*.css')"
          if [ -z "${changed}" ]; then
            echo "✓ no JavaScript or CSS changes in src/"
            exit 0
          fi
          old="$(git show "${base}:package.json" | jq -r .version)"
          new="$(git show "${HEAD_SHA}:package.json" | jq -r .version)"
          if [ "${old}" = "${new}" ]; then
            {
              echo "::error::src/ JavaScript or CSS changed but package.json is still ${old}."
              echo "Changed files:"
              echo "${changed}"
              echo "Bump the version in this PR (package.json, package-lock.json and the ?v= URLs in src/index.html) and add its CHANGELOG section; see README 'Versiones'."
            } >&2
            exit 1
          fi
          echo "✓ version ${old} → ${new} for:"
          echo "${changed}"

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Google Chrome; puppeteer-core drives it
      # instead of downloading its own browser.
      - name: Run the smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -eu
          "${CHROME_PATH}" --version
          npm run test:e2e

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Thresholds live in lighthouserc.json: accessibility below 0.9
      # fails the job; the other categories only warn.
      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.16.0 autorun
      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
