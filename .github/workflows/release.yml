name: Release

# Pipeline: validate-tag-input → (verify-tag-reachability ∥
# verify-tag-signature) → build → publish → verify-deployment.
# Same structural guarantees as the release workflows of
# airvzxf/ftp-deployment-action and airvzxf/telora.
#
# What a release is here
# ----------------------
# The site itself is deployed by Cloudflare Pages, which is connected
# to this repository and publishes src/ on every push to main. A
# release does not deploy anything: it marks a commit of main as a
# version, publishes the site files as a GitHub Release asset with
# build provenance, and then checks that production serves exactly
# those files.
#
# Triggers
# --------
# * `push` on tags matching `v[0-9]+.[0-9]+.[0-9]+*` (the `*` allows
#   pre-release tags such as `v1.1.0-rc.1`).
# * `workflow_dispatch` with a `version` input, validated by the
#   `validate-tag-input` job (the input schema has no `pattern:`).
#
# Why several jobs
# ----------------
# * `validate-tag-input` rejects a malformed dispatch input before
#   anything else runs.
# * `verify-tag-reachability` and `verify-tag-signature` run in
#   parallel and gate `build`: the tag must point at a commit of main
#   whose package.json version and CHANGELOG.md match the tag, and it
#   must be signed by a key in .github/trusted-signers(.asc) on main.
# * `build` checks out the immutable commit SHA the verify jobs
#   approved, so moving the tag mid-run cannot redirect the build.
# * `publish` is the only job with `contents: write`.
# * `verify-deployment` compares production with the tagged files.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.0.0). Must exist on the remote. Format is validated by the validate-tag-input job.'
        required: true
        type: string

# One release per tag: two runs for the same tag must not race the
# publish step.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# No top-level `permissions:`: each job declares its own.

env:
  PRODUCTION_URL: https://exponent-plot.rovisoft.net
  # awk program that prints the CHANGELOG.md section for version `v`
  # (`awk -v v=X.Y.Z`). Defined once so the reachability check and the
  # build job's extraction cannot disagree. It skips `## [Unreleased]`
  # and stops at the next `## [...]` heading or the link footer
  # (`[Unreleased]: ...` or `[X.Y.Z]: ...`).
  CHANGELOG_SECTION_AWK: |
    BEGIN {
        in_section = 0
        v_escaped = v
        gsub(/\./, "\\.", v_escaped)
        heading_re = "^## \\[" v_escaped "\\]( -.*)?$"
        next_heading_re = "^## \\["
        compare_re = "^\\[([0-9]+\\.[0-9]+\\.[0-9]+[^]]*|Unreleased)\\]:"
    }
    $0 ~ heading_re { in_section = 1; next }
    in_section && $0 ~ next_heading_re { exit }
    in_section && $0 ~ compare_re { exit }
    in_section { print }

jobs:
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          # Reject non-printable characters first: grep anchors per line,
          # so a line break could otherwise smuggle a second line past
          # the regex. The regex then rejects shell metacharacters.
          case "${TAG}" in
            *[![:print:]]*)
              echo "ERROR: tag input contains a non-printable character (e.g. a line break)"
              exit 1
              ;;
          esac
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "ERROR: '${TAG}' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if package.json version at the tag commit differs from the tag
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          version="$(git show "${TAG_COMMIT}:package.json" | jq -r '.version')"
          if [ "${version}" != "${expected}" ]; then
            echo "::error::package.json version at ${TAG} (${TAG_COMMIT}) is '${version}', expected '${expected}'. Bump it (and the ?v= asset URLs in src/index.html) in the release PR and re-tag."
            exit 1
          fi
          echo "✓ package.json version ${version} matches ${TAG}"

      - name: Fail if CHANGELOG at the tag commit has no section for the version
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          core="${TAG#v}"
          core="${core%%-*}"
          if ! changelog="$(git show "${TAG_COMMIT}:CHANGELOG.md")"; then
            echo "::error::CHANGELOG.md is missing at ${TAG} (${TAG_COMMIT}); expected a '## [${core}]' section. Add it in the release PR and re-tag."
            exit 1
          fi
          notes="$(awk -v v="${core}" "${CHANGELOG_SECTION_AWK}" <<< "${changelog}")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md at ${TAG} (${TAG_COMMIT}) has no '## [${core}]' section, or the section is empty. Add the release notes in the release PR and re-tag."
            exit 1
          fi
          echo "✓ CHANGELOG.md has a non-empty [${core}] section for ${TAG}"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "The tag was created on a branch tip or a commit that was"
            echo "squashed away when the release PR was merged."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git switch main && git pull --ff-only"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}' \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      verified_commit: ${{ steps.verify.outputs.VERIFIED_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      # The allow-list comes from origin/main, not from the tagged
      # commit, so a tag cannot bring its own signer.
      - name: Fetch allow-list from origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "PGP allow-list fetched"
          else
            echo "PGP allow-list absent on origin/main (acceptable only if the tag is not PGP-signed)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      # The signature starts at the last line that is exactly a BEGIN
      # marker, so a tag message that quotes one is not mistaken for it.
      - name: Import GPG allow-list if the tag is PGP-signed
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          SIG=lightweight
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)" = tag ]; then
            OBJ="$(git cat-file tag "refs/tags/$TAG")"
            SIG="$(printf '%s\n' "$OBJ" | awk '
              $0 == "-----BEGIN PGP SIGNATURE-----" { fmt = "pgp" }
              $0 == "-----BEGIN SSH SIGNATURE-----" { fmt = "ssh" }
              END { if (fmt == "") fmt = "unsigned"; print fmt }')"
          fi
          if [ "$SIG" = pgp ]; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag has no PGP signature block — GPG keyring not required"
          fi

      - name: Verify tag signature
        id: verify
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "refs/tags/${TAG}"; then
            echo "✓ ${TAG} is signed by a key in the trusted-signers allow-list from origin/main"
            TAG_NAME="$(git cat-file tag "refs/tags/${TAG}" | sed -n '1,/^$/s/^tag //p')"
            if [ -z "${TAG_NAME}" ]; then
              echo "::error::refs/tags/${TAG} has no tag header (not a tag object)"
              exit 1
            fi
            if [ "${TAG_NAME}" != "${TAG}" ]; then
              echo "::error::tag object is named '${TAG_NAME}' but was pushed as refs/tags/${TAG}"
              exit 1
            fi
            VERIFIED_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "VERIFIED_COMMIT=${VERIFIED_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (SSH) or .github/trusted-signers.asc (PGP), fetched from origin/main."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}'"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  build:
    name: 'Build · site archive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [validate-tag-input, verify-tag-reachability, verify-tag-signature]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Fail if the verified tag commit differs from tag_commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify-tag-signature.outputs.verified_commit }}
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
        run: |
          set -euo pipefail
          for pair in "verified_commit=${VERIFIED_COMMIT}" "tag_commit=${TAG_COMMIT}"; do
            if ! [[ "${pair#*=}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${pair%%=*} '${pair#*=}' is not a 40-char lowercase hex SHA"
              exit 1
            fi
          done
          if [ "${VERIFIED_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "::error::Signed tag points at ${VERIFIED_COMMIT}, but reachability approved ${TAG_COMMIT}; the tag moved between the verify jobs"
            exit 1
          fi
          echo "✓ verified tag commit equals tag_commit (${TAG_COMMIT})"

      - name: Checkout the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          persist-credentials: false

      - name: Resolve version
        id: meta
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # The same checks as CI, on the exact commit being released.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Run the e2e smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -eu
          "${CHROME_PATH}" --version
          npm run test:e2e

      # Reproducible archive: sorted names, fixed owner and the commit
      # time as mtime, so the same commit always gives the same bytes.
      - name: Package src/
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ART_DIR="${TEMP_DIR}/release-artifacts"
          mkdir -p "${ART_DIR}"
          name="exponent-plot-${VERSION}"
          archive="${ART_DIR}/${name}.tar.gz"
          mtime="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${mtime}" --owner=0 --group=0 --numeric-owner \
            --transform "s,^src,${name}," -cf - src \
            | gzip -n -9 > "${archive}"
          tar -tzf "${archive}"
          (cd "${ART_DIR}" && sha256sum "${name}.tar.gz" > SHA256SUMS)
          cat "${ART_DIR}/SHA256SUMS"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Extract CHANGELOG notes for this version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          core="${VERSION%%-*}"
          notes=$(awk -v v="${core}" "${CHANGELOG_SECTION_AWK}" CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::no non-empty CHANGELOG section found for ${core}."
            exit 1
          fi
          printf '%s\n' "${notes}" > "${TEMP_DIR}/release-artifacts/CHANGELOG.body.md"
          echo "wrote $(wc -l < "${TEMP_DIR}/release-artifacts/CHANGELOG.body.md") lines to CHANGELOG.body.md"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exponent-plot-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 'Publish · GitHub Release'
    needs: [validate-tag-input, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exponent-plot-release-bundle
          path: release/

      - name: Extract metadata
        id: meta
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          body="$(cat release/CHANGELOG.body.md)"
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "tag=${TAG}"
            echo "body<<${delim}"
            printf '%s\n' "${body}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.meta.outputs.tag, '-') }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            release/exponent-plot-*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true

  # Cloudflare Pages deploys main on its own; this job only checks the
  # result. The comparison is by content because Pages answers a missing
  # path with index.html and status 200. Production must serve every file of src/ at the tag byte for
  # byte, with the JS and CSS fetched by the same ?v= URLs the page uses.
  # If main changed src/ after the tag, production legitimately serves
  # newer files and the check is skipped with a notice.
  verify-deployment:
    name: 'Verify · production serves the release'
    needs: [validate-tag-input, verify-tag-reachability, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if main changed src/ after the tag
        id: drift
        env:
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git diff --quiet "${TAG_COMMIT}" origin/main -- src/; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✓ src/ on origin/main equals the release"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::origin/main changed src/ after the release commit; production serves newer files, so the comparison is skipped"
          fi

      - name: Compare production with src/
        if: steps.drift.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          attempts=20
          for attempt in $(seq 1 "${attempts}"); do
            mismatches=0
            while IFS= read -r file; do
              case "${file}" in
                index.html) path="" ;;
                *.js|*.css) path="${file}?v=${VERSION}" ;;
                *) path="${file}" ;;
              esac
              expected="$(sha256sum "src/${file}" | cut -d' ' -f1)"
              actual="$(curl -fsSL --retry 2 "${PRODUCTION_URL}/${path}" | sha256sum | cut -d' ' -f1 || true)"
              if [ "${expected}" = "${actual}" ]; then
                echo "✓ /${path}"
              else
                echo "✗ /${path} (expected ${expected}, got ${actual})"
                mismatches=$((mismatches + 1))
              fi
            done < <(cd src && find . -type f -printf '%P\n' | sort)
            if [ "${mismatches}" -eq 0 ]; then
              echo "✓ ${PRODUCTION_URL} serves the release (attempt ${attempt})"
              exit 0
            fi
            echo "${mismatches} file(s) differ (attempt ${attempt}/${attempts})"
            if [ "${attempt}" -lt "${attempts}" ]; then
              sleep 30
            fi
          done
          echo "::error::${PRODUCTION_URL} does not serve the files of this release after ${attempts} attempts. Check the Cloudflare Pages deployment of main."
          exit 1
